[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["OutilsEnLigne.ca"]
license = "MPL-2.0"

[profile.release]
opt-level = "s"
lto = true

# `cargo run -p oel-fuzz --profile fuzz`: fast, but an overflow panics instead of wrapping as it would in WASM.
[profile.fuzz]
inherits = "release"
opt-level = 3
lto = false
overflow-checks = true
debug-assertions = true
