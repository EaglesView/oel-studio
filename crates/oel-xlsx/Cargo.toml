[package]
name = "oel-xlsx"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Lossless XLSX/CSV codec and IronCalc-based calc engine"

[lib]
name = "oelxlsx"
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
ironcalc_base = "0.8.3"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
encoding_rs = "0.8"
oel-opc = { path = "../oel-opc" }
