[package]
name = "oel-xlsx"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lossless XLSX/CSV codec and IronCalc-based calc engine"

[lib]
name = "oelxlsx"
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# TypeScript bindings for @oel/engine (`npm run gen:types`); dev-only.
ts = ["dep:ts-rs", "oel-chart/ts"]

[dependencies]
ironcalc_base = "0.8.3"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
encoding_rs = "0.8"
oel-opc = { path = "../oel-opc" }
oel-chart = { path = "../oel-chart" }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"], optional = true }
