[package]
name = "oel-docx"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lossless DOCX <-> ProseMirror JSON codec for the @oel/docs editor"

[lib]
name = "oeldocx"
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook"]
# TypeScript bindings for @oel/engine (`npm run gen:types`); dev-only.
ts = ["dep:ts-rs", "oel-chart/ts"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"], optional = true }
oel-opc = { path = "../oel-opc" }
oel-chart = { path = "../oel-chart" }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
