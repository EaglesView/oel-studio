[package]
name = "oel-img"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Non-destructive image editing: oel-img-recipe@1, CPU reference pipeline (wgpu pipeline next)"

[lib]
name = "oelimg"
crate-type = ["cdylib", "rlib"]

[features]
default = ["decode"]
# Native/server decoding (JPEG, PNG, WebP) with EXIF orientation and ICC → sRGB.
# The browser decodes with createImageBitmap and hands RGBA to the engine.
decode = ["dep:image", "dep:moxcms"]
wasm = ["dep:wasm-bindgen"]
# TypeScript bindings for @oel/img (`npm run gen:types`); dev-only.
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
moxcms = { version = "0.9", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"], optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
