[package]
name = "oel-chart"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DrawingML charts (c:chartSpace, cx:chartSpace) <-> ChartSpec JSON, shared by the xlsx, pptx and docx codecs"

[lib]
name = "oelchart"

[features]
# TypeScript bindings for @oel/charts (`npm run gen:types`); dev-only.
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oel-opc = { path = "../oel-opc" }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"], optional = true }
